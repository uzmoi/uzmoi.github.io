version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 7
    groups:
      deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-minor, version-update:semver-patch]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
